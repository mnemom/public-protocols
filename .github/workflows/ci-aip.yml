name: CI (aip)

# Per-package CI for aip/ in the public-protocols monorepo (MNE-6778).
# working-directory and cache/coverage paths are prefixed with aip/.
# The original repo's dispatch-deploy job was dropped on consolidation:
# it depended on DEPLOY_APP_ID/DEPLOY_APP_PRIVATE_KEY secrets and a 1:1
# repo->deploy mapping that no longer holds for a monorepo (deploy wiring
# is a follow-up human decision).

on:
  push:
    branches: [main]
    paths: ["aip/**", ".github/workflows/ci-aip.yml"]
  pull_request:
    branches: [main]
    paths: ["aip/**", ".github/workflows/ci-aip.yml"]

permissions: {}
jobs:
  typescript:
    permissions:
      contents: read
    name: aip TypeScript SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aip/packages/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: aip/packages/typescript/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  python:
    permissions:
      contents: read
    name: aip Python SDK (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: aip/packages/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv + Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Check uv.lock is in sync with pyproject.toml
        run: uv lock --check
      - name: Install dependencies (frozen, from uv.lock)
        run: uv sync --locked --extra dev
      - name: Lint
        run: uv run --locked --extra dev ruff check src/ tests/
      - name: Typecheck
        if: matrix.python-version == '3.12'
        run: uv run --locked --extra dev mypy src/
      - name: Test
        run: uv run --locked --extra dev pytest
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          file: aip/packages/python/coverage.xml
          flags: python
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
