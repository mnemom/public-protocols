name: CI (aap)

# Per-package CI for aap/ in the public-protocols monorepo (MNE-6778).
# working-directory / coverage paths prefixed with aap/. dispatch-deploy job
# dropped on consolidation (secret + repo->deploy mapping is a follow-up).

on:
  push:
    branches: [main]
    paths: ["aap/**", ".github/workflows/ci-aap.yml"]
  pull_request:
    branches: [main]
    paths: ["aap/**", ".github/workflows/ci-aap.yml"]
  workflow_dispatch:

permissions: {}
jobs:
  python:
    name: aap Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: aap
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv + Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Check uv.lock is in sync with pyproject.toml
        run: uv lock --check
      - name: Type check (mypy strict)
        if: matrix.python-version == '3.12'
        run: uv run --locked --extra dev mypy src/
      - name: Run tests with coverage
        run: uv run --locked --extra dev pytest tests/ --cov=src/aap --cov-report=xml --cov-report=term-missing
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./aap/coverage.xml
          flags: python
          fail_ci_if_error: false
          verbose: true

  typescript:
    name: aap TypeScript
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: aap/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Run tests with coverage
        run: npx vitest run --coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./aap/typescript/coverage/lcov.info
          flags: typescript
          fail_ci_if_error: false
          verbose: true
      - name: Build
        run: npm run build

  lint:
    name: aap Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: aap
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==25.0.1
          pip install ruff==0.15.5
      - name: Run ruff
        run: ruff check src/ tests/
