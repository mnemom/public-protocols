name: CI (aap)

# Per-package CI for aap/ in the public-protocols monorepo (MNE-6778).
# working-directory / coverage paths prefixed with aap/. dispatch-deploy job
# dropped on consolidation (secret + repo->deploy mapping is a follow-up).

on:
  push:
    branches: [main]
    paths: ["aap/**", ".github/workflows/ci-aap.yml"]
  pull_request:
    branches: [main]
    paths: ["aap/**", ".github/workflows/ci-aap.yml"]
  workflow_dispatch:

permissions: {}
jobs:
  python:
    name: aap Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: aap
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv + Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Check uv.lock is in sync with pyproject.toml
        run: uv lock --check
      - name: Type check (mypy strict)
        if: matrix.python-version == '3.12'
        run: uv run --locked --extra dev mypy src/
      - name: Run tests with coverage
        run: uv run --locked --extra dev pytest tests/ --cov=src/aap --cov-report=xml --cov-report=term-missing
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./aap/coverage.xml
          flags: python
          fail_ci_if_error: false
          verbose: true

  typescript:
    name: aap TypeScript
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: aap/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Run tests with coverage
        run: npx vitest run --coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./aap/typescript/coverage/lcov.info
          flags: typescript
          fail_ci_if_error: false
          verbose: true
      - name: Build
        run: npm run build

  lint:
    name: aap Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: aap
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==25.0.1
          pip install ruff==0.15.5
      - name: Run ruff
        run: ruff check src/ tests/
