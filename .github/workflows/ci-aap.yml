name: CI (aap)

# Per-package CI for aap/ in the public-protocols monorepo (MNE-6778).
# working-directory / coverage paths prefixed with aap/. dispatch-deploy job
# dropped on consolidation (secret + repo->deploy mapping is a follow-up).

on:
  push:
    branches: [main]
    paths: ["aap/**", ".github/workflows/ci-aap.yml"]
  pull_request:
    branches: [main]
    paths: ["aap/**", ".github/workflows/ci-aap.yml"]
  workflow_dispatch:

permissions: {}
jobs:
  python:
    name: aap Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: aap
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up uv + Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Check uv.lock is in sync with pyproject.toml
        run: uv lock --check
      - name: Type check (mypy strict)
        if: matrix.python-version == '3.12'
        run: uv run --locked --extra dev mypy src/
      - name: Run tests with coverage
        run: uv run --locked --extra dev pytest tests/ --cov=src/aap --cov-report=xml --cov-report=term-missing
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./aap/coverage.xml
          flags: python
          fail_ci_if_error: false
          verbose: true

  typescript:
    name: aap TypeScript
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: aap/typescript
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Run tests with coverage
        run: npx vitest run --coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./aap/typescript/coverage/lcov.info
          flags: typescript
          fail_ci_if_error: false
          verbose: true
      - name: Build
        run: npm run build

  lint:
    name: aap Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: aap
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==25.0.1
          pip install ruff==0.15.5
      - name: Run ruff
        run: ruff check src/ tests/
