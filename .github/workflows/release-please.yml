name: release-please

# Consolidated release-please for the public-protocols monorepo (MNE-6778).
# One manifest-mode config at the repo root covers all managed packages under
# their new subdirectory paths. TypeScript packages now carry a component in
# their tag (include-component-in-tag) so @mnemom/agent-integrity-protocol and
# @mnemom/agent-alignment-protocol no longer collide on a bare `v<version>` tag.
#
# aip-otel-exporter is intentionally NOT managed here — it had no release-please
# config pre-consolidation and continues to be released by cutting a GitHub
# release manually.

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Org policy blocks the default GITHUB_TOKEN from opening PRs org-wide, so
      # release-please authenticates as the org release GitHub App instead.
      # Requires org secrets MNEMOM_RELEASE_APP_ID + MNEMOM_RELEASE_PRIVATE_KEY
      # to be visible to this repo and the "mnemom-release" App installed on it.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.MNEMOM_RELEASE_APP_ID }}
          private-key: ${{ secrets.MNEMOM_RELEASE_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
