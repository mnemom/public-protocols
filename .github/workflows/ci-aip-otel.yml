name: CI (aip-otel-exporter)

# Per-package CI for aip-otel-exporter/ in the public-protocols monorepo
# (MNE-6778). npm-workspace commands run from the sub-project root; python
# steps cd into its packages/python. dispatch-deploy job dropped on
# consolidation (secret + repo->deploy mapping is a follow-up).

on:
  push:
    branches: [main]
    paths: ["aip-otel-exporter/**", ".github/workflows/ci-aip-otel.yml"]
  pull_request:
    branches: [main]
    paths: ["aip-otel-exporter/**", ".github/workflows/ci-aip-otel.yml"]

permissions: {}
jobs:
  typescript:
    permissions:
      contents: read
    name: aip-otel TypeScript
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20", "22"]
    defaults:
      run:
        working-directory: aip-otel-exporter
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: aip-otel-exporter/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run lint --workspace=packages/typescript
      - name: Test
        run: npm run test:coverage --workspace=packages/typescript
      - name: Upload coverage
        if: matrix.node-version == '20'
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: aip-otel-exporter/packages/typescript/coverage
          flags: typescript
          fail_ci_if_error: false
      - name: Benchmark
        run: npm run bench --workspace=packages/typescript

  python:
    permissions:
      contents: read
    name: aip-otel Python
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    defaults:
      run:
        working-directory: aip-otel-exporter/packages/python
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src/ tests/
      - name: Type check
        if: matrix.python-version == '3.12'
        run: mypy src/
      - name: Test
        run: python -m pytest tests/ -v
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: aip-otel-exporter/packages/python/coverage.xml
          flags: python
          fail_ci_if_error: false
